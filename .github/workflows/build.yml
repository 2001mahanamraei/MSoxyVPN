name: Build MSoxyVPN

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Collect runtime files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item build\Release\MSoxyVPN.exe dist\

          # tun2socks engine
          if (Test-Path third_party\hev-socks5-tunnel.exe) {
            Copy-Item third_party\* dist\ -Recurse -Force
          } else {
            gh release download --repo heiher/hev-socks5-tunnel --pattern "*win*" --dir hev
            Get-ChildItem hev -Filter *.zip | ForEach-Object {
              Expand-Archive $_.FullName -DestinationPath hev\x -Force
            }
            if (Test-Path hev\x) { Get-ChildItem hev\x -Recurse -File | Copy-Item -Destination dist -Force }
            Get-ChildItem hev -File | Where-Object Extension -ne '.zip' | Copy-Item -Destination dist -Force
          }
          if (!(Test-Path dist\hev-socks5-tunnel.exe)) {
            $f = Get-ChildItem dist -Filter "hev*.exe" | Select-Object -First 1
            if ($f) { Rename-Item $f.FullName hev-socks5-tunnel.exe }
            else { throw "hev-socks5-tunnel.exe not found. Put it in third_party/ and re-run." }
          }

          # Wintun driver DLL
          if (!(Test-Path third_party\wintun.dll)) {
            Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
            Expand-Archive wintun.zip -DestinationPath wintun -Force
            Copy-Item wintun\wintun\bin\amd64\wintun.dll dist\ -Force
          }

          Compress-Archive -Path dist\* -DestinationPath MSoxyVPN-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MSoxyVPN-win64
          path: MSoxyVPN-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MSoxyVPN-win64.zip
